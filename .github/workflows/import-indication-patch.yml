name: Import indication patch

on:
  push:
    branches: [main]
    paths:
      - "_incoming/READY"

permissions:
  contents: write

jobs:
  import-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and apply patch
        shell: bash
        run: |
          set -euo pipefail
          ZIP="_incoming/patch.zip"
          test -f "$ZIP"
          rm -rf /tmp/pbm-patch
          mkdir -p /tmp/pbm-patch
          unzip -q "$ZIP" -d /tmp/pbm-patch

          mapfile -t FILES < <(find /tmp/pbm-patch -type f | sort)
          test "${#FILES[@]}" -gt 0
          for f in "${FILES[@]}"; do
            rel="${f#/tmp/pbm-patch/}"
            case "$rel" in
              dist/indications/*/index.html) ;;
              *)
                echo "Unexpected patch file: $rel"
                exit 1
                ;;
            esac
          done

          cp -a /tmp/pbm-patch/dist/. dist/
          rm -rf _incoming

          echo "Applied ${#FILES[@]} indication pages."

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PBM Science updater"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply PBM indication site patch"
          git push
