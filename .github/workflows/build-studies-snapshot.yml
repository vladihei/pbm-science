name: Build public ongoing studies snapshot

on:
  push:
    branches:
      - main
    paths-ignore:
      - "dist/studies/ongoing-studies.json"
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      retrieved_on:
        description: "Local retrieval date (YYYY-MM-DD); leave blank to use Europe/Helsinki today"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-studies-snapshot
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run source-processing tests
        run: python -m unittest discover -s tests -v

      - name: Test public studies Worker
        run: node tests/test_studies_auth.mjs

      - name: Choose retrieval date
        env:
          INPUT_RETRIEVED_ON: ${{ inputs.retrieved_on }}
        run: |
          if [ -n "$INPUT_RETRIEVED_ON" ]; then
            retrieved_on="$INPUT_RETRIEVED_ON"
          else
            retrieved_on="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Europe/Helsinki")).date().isoformat())')"
          fi
          RETRIEVED_ON="$retrieved_on" python -c 'from datetime import date; import os; date.fromisoformat(os.environ["RETRIEVED_ON"])'
          echo "RETRIEVED_ON=$retrieved_on" >> "$GITHUB_ENV"

      - name: Fetch all ClinicalTrials.gov query pages and source timestamp
        run: python scripts/fetch_clinicaltrials_gov.py --retrieved-on "$RETRIEVED_ON"

      - name: Prepare the dated metadata and process the source snapshot
        run: |
          python - "$RETRIEVED_ON" <<'PY'
          import json, sys
          from pathlib import Path
          retrieved_on = sys.argv[1]
          manifest_path = Path("data/direct-sources/raw/clinicaltrials-gov") / f"{retrieved_on}-manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          metadata_path = Path("data/direct-sources/snapshot-metadata.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          metadata["retrieved_on"] = retrieved_on
          metadata["source_data_timestamp"] = manifest["source_data_timestamp"]
          metadata_path.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python scripts/process_direct_sources.py --manifest "data/direct-sources/raw/clinicaltrials-gov/$RETRIEVED_ON-manifest.json"

      - name: Verify the snapshot is ready and contains only cleared source fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          snapshot = json.loads(Path("data/direct-sources/private/ongoing-studies.json").read_text(encoding="utf-8"))
          metadata = json.loads(Path("data/direct-sources/snapshot-metadata.json").read_text(encoding="utf-8"))
          registries = {record["registry"] for record in snapshot["records"]}
          if snapshot["snapshot_status"] != "ready" or not snapshot["records"]:
              raise SystemExit(f"Snapshot is not ready: {snapshot['publication_blockers']}")
          if metadata.get("quality_review", {}).get("status") != "passed":
              raise SystemExit("The source-specific quality review has not passed")
          reuse = metadata.get("reuse_review", {})
          if reuse.get("status") != "cleared" or reuse.get("distribution_permitted") is not True:
              raise SystemExit("Public distribution has not been cleared for this source")
          if registries != {"ClinicalTrials.gov"}:
              raise SystemExit(f"Unexpected source set: {sorted(registries)}")
          if not snapshot.get("source_data_timestamp"):
              raise SystemExit("Missing source data timestamp")
          print(f"Ready: {len(snapshot['records'])} records; timestamp {snapshot['source_data_timestamp']}")
          PY

      - name: Publish the cleared snapshot as public website data
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          source = Path("data/direct-sources/private/ongoing-studies.json")
          destination = Path("dist/studies/ongoing-studies.json")
          snapshot = json.loads(source.read_text(encoding="utf-8"))
          metadata = json.loads(Path("data/direct-sources/snapshot-metadata.json").read_text(encoding="utf-8"))
          if snapshot.get("source_data_timestamp") != metadata.get("source_data_timestamp"):
              raise SystemExit("Snapshot source timestamp does not match the cleared metadata")
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, destination)
          print(f"Published public snapshot: {len(snapshot['records'])} records")
          PY

      - name: Commit only the cleared public website snapshot
        run: |
          git restore -- data/direct-sources/snapshot-metadata.json
          git add -- dist/studies/ongoing-studies.json
          if git diff --cached --quiet; then
            echo "Public snapshot is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh public ongoing studies snapshot"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Main moved during the push; retrying on its latest commit (attempt $attempt)."
            done
            echo "Could not push the public snapshot after three attempts."
            exit 1
          fi
